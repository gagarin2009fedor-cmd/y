<!doctype html><html lang="ru"><head><meta charset="utf-8"><style>
html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden;font-family:Arial,sans-serif}.w{width:1000px;height:190px;padding:28px 35px;box-sizing:border-box;color:#fff;position:relative}.row{display:flex;align-items:center;gap:18px}.ico{width:48px;height:48px;border:2px solid #a00;border-radius:50%;background:#090000;box-shadow:0 0 15px #900;position:relative}.ico:after,.ico:before{content:"";position:absolute;top:15px;width:7px;height:13px;background:#eee;border-radius:50%}.ico:before{left:12px}.ico:after{right:12px}.info{flex:1;min-width:0}.title{font-size:38px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 2px #200,0 4px 12px #000,0 0 14px #900}.time{font-size:22px;font-weight:800;min-width:155px;text-align:right;text-shadow:0 2px 8px #000}.sub{position:absolute;left:102px;top:103px;font-size:12px;letter-spacing:4px;color:#aaa}.bar{position:absolute;left:35px;right:35px;bottom:38px;height:15px;background:#160000;border:1px solid #444;transform:skewX(-10deg);box-shadow:0 0 10px #000}.fill{height:100%;width:0;background:linear-gradient(90deg,#300,#800,#e00000,#600);box-shadow:0 0 10px #c00}.dot{position:absolute;top:50%;left:0;width:20px;height:20px;transform:translate(-50%,-50%) rotate(45deg);background:#d00000;border:2px solid #fff;box-shadow:0 0 15px #d00}.warn{position:absolute;right:35px;bottom:61px;font-size:10px;letter-spacing:2px;color:#e66}
</style></head><body><div class="w"><div class="row"><div class="ico"></div><div class="info"><div class="title" id="t">Стена среди поля</div></div><div class="time" id="tm">00:00 / 25:25</div></div><div class="sub">RALPHHORROR // ARCHIVE</div><div class="bar"><div class="fill" id="f"></div><div class="dot" id="d"></div></div><div class="warn">DO NOT LOOK BACK</div></div><script>
const a=[["Стена среди поля",1525],["Лесная баба",1625],["Глазастый...",1504],["Плачущий мальчик",1536],["Болотина",1678],["Глаз",1597],["Выморочное жильё",1536],["Шиликун",1456]];
let s=[],x=0;a.forEach(v=>{s.push({title:v[0],start:x,end:x+v[1]});x+=v[1]});const st=performance.now(),t=document.getElementById("t"),tm=document.getElementById("tm"),f=document.getElementById("f"),d=document.getElementById("d");
function fmt(n){n=Math.floor(n);let h=Math.floor(n/3600),m=Math.floor(n%3600/60),q=n%60;return h?`${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(q).padStart(2,"0")}`:`${String(m).padStart(2,"0")}:${String(q).padStart(2,"0")}`}
function u(){let e=(performance.now()-st)/1000,z=s.find(v=>e>=v.start&&e<v.end)||s.at(-1),l=Math.max(0,Math.min(e-z.start,z.end-z.start)),p=l/(z.end-z.start)*100;t.textContent=z.title;tm.textContent=fmt(l)+" / "+fmt(z.end-z.start);f.style.width=p+"%";d.style.left=p+"%";requestAnimationFrame(u)}u();
</script></body></html>
